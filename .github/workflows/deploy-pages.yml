name: Deploy website to GitHub Pages

# Publishes ONLY the static website/ directory. No build step, no secrets.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/stamp-version.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Guard against secrets in the published folder
        run: |
          if grep -rIlE '"private_key"|"type": *"service_account"|BEGIN (RSA )?PRIVATE KEY' website/; then
            echo "::error::Credential-like content found in website/. Refusing to publish."; exit 1
          fi
      - name: Version-stamp module URLs (cache busting; Pages caches files for 10 min)
        run: node scripts/stamp-version.mjs website "${GITHUB_SHA}"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v5
